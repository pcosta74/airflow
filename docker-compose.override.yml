x-airflow-override: &airflow-override
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${SHOP_USER}:${SHOP_PASSWORD}@pg-shop:5432/${AIRFLOW_DB}
    REQUESTS_CA_BUNDLE: /opt/airflow/certs/snowflake.crt
    SNOWFLAKE_EMULATOR: "true"
  depends_on:
    snowflake:
      condition: service_healthy
    silo-s3:
      condition: service_healthy
  volumes:
    - ./config/airflow.cfg:/opt/airflow/config/airflow.cfg:ro
    - ./static/sf-emulator-nginx.crt:/opt/airflow/certs/snowflake.crt

services:
  superset:
    environment:
      REQUESTS_CA_BUNDLE: /app/certs/snowflake.crt
      SNOWFLAKE_EMULATOR: "true"
      SUPERSET_CONFIG_PATH: /app/init-superset.py
    volumes:
      - ./static/sf-emulator-nginx.crt:/app/certs/snowflake.crt:ro

  snowflake:
    build:
      context: .
      dockerfile: Dockerfile.sf-emulator
    container_name: snowflake
    restart: unless-stopped
    ports:
      - "443:443"
      - "4566:4566"
    env_file:
      - .env
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?LOCALSTACK_AUTH_TOKEN is missing in .env}
      - DEBUG=1
      - PERSISTENCE=1
      - MINIO_BUCKET=${MINIO_BUCKET:?MINIO_BUCKET is missing in .env}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER is missing in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is missing in .env}
      - SNOWFLAKE_USER=${SNOWFLAKE_USER:?SNOWFLAKE_USER is missing in .env}
      - SNOWFLAKE_PASSWORD=${SNOWFLAKE_PASSWORD:?SNOWFLAKE_PASSWORD is missing in .env}
      - SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT:?SNOWFLAKE_ACCOUNT is missing in .env}
      - SNOWFLAKE_DATABASE=${SNOWFLAKE_DATABASE:?SNOWFLAKE_DATABASE is missing in .env}
      - SNOWFLAKE_SCHEMA=${SNOWFLAKE_SCHEMA:?SNOWFLAKE_SCHEMA is missing in .env}
      - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE:?SNOWFLAKE_WAREHOUSE is missing in .env}
    volumes:
      - snowflake_data:/var/lib/localstack
      - ./deploy/init-datawarehouse.sf.sql:/docker-entrypoint-initaws.d/init-datawarehouse.sf.sql:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  silo-s3:
    image: pgsty/silo:latest
    container_name: silo-s3
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./datalake:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  pim:
    build:
      context: .
      dockerfile: ./Dockerfile.pim
    container_name: pim
    restart: unless-stopped
    ports:
      - "9999:9999"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pg-shop:
    ports: !override
      - "5432:5432"
    entrypoint: !reset []
    environment:
      POSTGRES_USER: ${SHOP_USER:?Set SHOP_USER in .env}
      POSTGRES_PASSWORD: ${SHOP_PASSWORD:?Set SHOP_PASSWORD in .env}
      POSTGRES_DB: ${SHOP_DB:?Set SHOP_DB in .env}
    volumes:
      - ./.docker/postgres/init-airflow.sql:/docker-entrypoint-initdb.d/init-airflow.sql:ro

  pg-airflow:
    image: alpine/socat:latest
    container_name: pg-airflow
    entrypoint: ["socat", "TCP-LISTEN:5432,fork,reuseaddr", "TCP:pg-shop:5432"]
    ports: !reset []
    volumes: !reset []
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5432"]
      interval: 2s
      timeout: 2s
      retries: 3

  airflow-init:
    <<: *airflow-override

  airflow-api-server:
    <<: *airflow-override

  airflow-dag-processor:
    <<: *airflow-override

  airflow-scheduler:
    <<: *airflow-override

  airflow-worker-api:
    <<: *airflow-override

  airflow-worker-compute:
    <<: *airflow-override

  airflow-worker-db:
    <<: *airflow-override

  airflow-worker-ml:
    <<: *airflow-override

  airflow-worker-utility:
    <<: *airflow-override

volumes:
  snowflake_data: