server {
    listen 9999;
    server_name _;

    location / {
        return 301 /health;
    }

    location = /products {
        default_type application/json;
        alias /usr/share/nginx/html/product_catalog.json;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
